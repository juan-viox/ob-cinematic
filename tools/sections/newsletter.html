<!-- ═══ SECTION 8: NEWSLETTER ═══ -->
<section id="newsletter">
  <div class="newsletter-inner fade-up">
    <div class="section-label">Stay Inspired</div>
    <h2 class="section-title">Gifting Inspiration, Delivered</h2>
    <p class="section-body" style="margin:0 auto 24px;text-align:center">Join our list for curated gifting ideas, new collections, and exclusive offers.</p>
    <form class="newsletter-form" id="newsletterForm">
      <input type="email" placeholder="Your email address" required id="newsletterEmail">
      <input type="text" name="hp_website_url" id="newsletterWebsite" class="hp-field" autocomplete="new-password" data-lpignore="true" data-1p-ignore data-form-type="other" tabindex="-1" aria-hidden="true">
      <button type="submit" id="newsletterBtn">Subscribe</button>
    </form>
  </div>
</section>
