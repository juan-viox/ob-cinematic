<!-- ═══ SECTION 9: CONTACT ═══ -->
<section id="contact">
  <div class="contact-grid">
    <div class="fade-up">
      <div class="section-label">Get in Touch</div>
      <h2 class="section-title">Let's Create Something Special</h2>
      <form class="contact-form" id="contactForm">
        <input type="text" placeholder="Your Name" required id="contactName">
        <input type="email" placeholder="Email Address" required id="contactEmail">
        <textarea placeholder="Tell us about your gifting needs..." id="contactMessage"></textarea>
        <input type="text" name="hp_website_url" id="contactWebsite" class="hp-field" autocomplete="new-password" data-lpignore="true" data-1p-ignore data-form-type="other" tabindex="-1" aria-hidden="true">
        <button type="submit" id="contactBtn">Send Message</button>
      </form>
    </div>
    <div class="contact-info fade-up">
      <div class="contact-item">
        <div class="contact-item-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
        <div>
          <div class="contact-item-label">Email</div>
          <div class="contact-item-value"><a href="mailto:Hello@occasionsbox.com">Hello@occasionsbox.com</a></div>
        </div>
      </div>
      <div class="contact-item">
        <div class="contact-item-icon"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></div>
        <div>
          <div class="contact-item-label">Instagram</div>
          <div class="contact-item-value"><a href="https://instagram.com/occasionsbox" target="_blank" rel="noopener">@occasionsbox</a></div>
        </div>
      </div>
      <div class="contact-item">
        <div class="contact-item-icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
        <div>
          <div class="contact-item-label">Pinterest</div>
          <div class="contact-item-value"><a href="https://pinterest.com/occasionsbox" target="_blank" rel="noopener">/occasionsbox</a></div>
        </div>
      </div>
      <div class="contact-item">
        <div class="contact-item-icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div>
          <div class="contact-item-label">Location</div>
          <div class="contact-item-value">New Jersey</div>
        </div>
      </div>
    </div>
  </div>
</section>
