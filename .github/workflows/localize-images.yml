name: Localize Squarespace images

# Fills site/assets/img from site/assets/img/manifest.tsv (<filename>\t<source URL>)
# and commits the result back to the branch the workflow ran from.
#
# The Squarespace CDN ignores the requested extension and returns whichever
# format it feels like (JPEG on one request, WebP on the next), so every
# download is converted to the format implied by its manifest filename. A file
# that is already present in the right format is left alone, which keeps re-runs
# from rewriting identical images with freshly re-encoded bytes.

on:
  # Manual run from the Actions tab. Tick "force" to re-fetch everything.
  workflow_dispatch:
    inputs:
      force:
        description: Re-download every image even if it is already correct
        type: boolean
        default: false
  # Automatic run when the manifest or this workflow changes, so a fresh
  # checkout ends up with the images without anyone clicking anything.
  push:
    paths:
      - 'site/assets/img/manifest.tsv'
      - '.github/workflows/localize-images.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          # The runner image does not ship ImageMagick. Install it together with
          # the extra delegates package, which is what gives ImageMagick 6 its
          # WebP reader — the CDN serves WebP for some requests.
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libmagickcore-6.q16-6-extra \
            || sudo apt-get install -y -qq imagemagick

          # ImageMagick 7 ships `magick`; 6 ships `convert` / `identify`.
          if command -v magick >/dev/null 2>&1; then
            echo "IM_CONVERT=magick" >> "$GITHUB_ENV"
            echo "IM_IDENTIFY=magick identify" >> "$GITHUB_ENV"
          elif command -v convert >/dev/null 2>&1; then
            echo "IM_CONVERT=convert" >> "$GITHUB_ENV"
            echo "IM_IDENTIFY=identify" >> "$GITHUB_ENV"
          else
            echo "::error::ImageMagick is not available after installation"
            exit 1
          fi

          # Fail early and loudly if the WebP and JPEG readers are missing.
          delegates="$(convert -version 2>/dev/null || magick -version)"
          echo "$delegates"
          for fmt in webp jpeg png; do
            grep -q " $fmt" <<<"$delegates" || echo "::warning::ImageMagick reports no $fmt delegate"
          done

      - name: Download and normalise images
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          MANIFEST="site/assets/img/manifest.tsv"
          DEST="site/assets/img"
          test -f "$MANIFEST" || { echo "Missing $MANIFEST"; exit 1; }
          mkdir -p "$DEST"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          failed=0 fetched=0 kept=0

          # Image format ImageMagick should write for a given filename.
          want_format() {
            case "${1##*.}" in
              jpg|jpeg) echo JPEG ;;
              png)      echo PNG ;;
              webp)     echo WEBP ;;
              *)        echo "" ;;
            esac
          }

          while IFS=$'\t' read -r name url; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            [ -n "${url:-}" ] || { echo "::error::No URL for $name"; failed=1; continue; }

            want="$(want_format "$name")"
            [ -n "$want" ] || { echo "::error::Unsupported extension for $name"; failed=1; continue; }

            # Already correct? Leave it alone so re-runs produce no diff.
            if [ "${FORCE:-false}" != "true" ] && [ -s "$DEST/$name" ]; then
              have="$($IM_IDENTIFY -format '%m' "$DEST/$name"[0] 2>/dev/null || echo '')"
              if [ "$have" = "$want" ]; then
                kept=$((kept + 1))
                continue
              fi
            fi

            echo "-> $name  <=  $url"
            if ! curl -fL --retry 3 --retry-delay 2 -sS -o "$tmp/download" "$url"; then
              echo "::error::Download failed for $name ($url)"
              failed=1
              continue
            fi
            if [ ! -s "$tmp/download" ]; then
              echo "::error::Downloaded file is empty: $name ($url)"
              failed=1
              continue
            fi
            if ! $IM_CONVERT "$tmp/download"[0] "$tmp/out.${name##*.}"; then
              echo "::error::Could not convert $name to $want"
              failed=1
              continue
            fi
            mv "$tmp/out.${name##*.}" "$DEST/$name"
            fetched=$((fetched + 1))
          done < "$MANIFEST"

          echo "Fetched $fetched, already correct $kept."
          if [ "$failed" -ne 0 ]; then
            echo "One or more images could not be localized; see errors above."
            exit 1
          fi

          # Every manifest entry must now exist in the right format.
          while IFS=$'\t' read -r name url; do
            [ -z "${name:-}" ] && continue
            case "$name" in \#*) continue ;; esac
            have="$($IM_IDENTIFY -format '%m' "$DEST/$name"[0])"
            [ "$have" = "$(want_format "$name")" ] || {
              echo "::error::$name is $have, expected $(want_format "$name")"
              exit 1
            }
          done < "$MANIFEST"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/img
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
            exit 0
          fi
          git commit -m "Localize Squarespace images"
          git push origin HEAD:${{ github.ref_name }}
